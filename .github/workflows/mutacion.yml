name: Pruebas de mutación
# Frente 1: mide si las pruebas DETECTAN errores, no solo si recorren líneas (cobertura).
# Corre en cada PR que toque las reglas de negocio, cada lunes y a demanda.
on:
  pull_request:
    paths: ["src/notas/**", "tests/unit/test_reglas*.py"]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt "mutmut<3"
      - name: mutmut run (falla si sobrevive algún mutante)
        run: mutmut run
      - if: always()
        run: |
          mutmut results
          mutmut junitxml > mutmut.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: reporte-mutacion
          path: mutmut.xml
