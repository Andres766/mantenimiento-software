name: CI NotasQA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read          # mínimo privilegio (DevSecOps)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Acciones fijadas por SHA completo (hallazgo "Use full commit SHA hash" de Sonar, semana 7).
# El comentario indica la versión a la que corresponde cada SHA.
jobs:
  pruebas:                      # Semanas 1-3: unitarias + API + cobertura >= 80 %
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Pytest con Quality Gate de cobertura (pytest.ini)
        run: python -m pytest --cov-report=html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  sonarcloud:                   # Semana 7: análisis estático + Quality Gate
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  contenedores:                 # Semanas 4-5 y 10: compose con LocalStack + test-runner
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pruebas de API dentro de contenedores
        run: docker compose up --build --exit-code-from test-runner
      - name: Boletín end-to-end (API -> S3 + SQS en LocalStack)
        run: |
          docker compose up -d --wait api
          python3 scripts/smoke_boletin.py http://localhost:8000
      - if: always()
        run: docker compose down -v

  carga:                        # Semana 8: Locust sin interfaz con umbrales
    needs: contenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose up -d --build --wait api
      - name: Locust 100 usuarios / 60 s (falla si p95 > 500 ms o fallos > 1 %)
        run: python -m locust -f load/locustfile.py --headless -u 100 -r 10 -t 60s --host http://localhost:8000 --csv carga --only-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: reporte-carga
          path: carga_*.csv
      - if: always()
        run: docker compose down -v
