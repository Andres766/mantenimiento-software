name: CI NotasQA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read          # mínimo privilegio (DevSecOps)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todas las acciones van fijadas por SHA completo (regla de Sonar, semana 7). En marzo de 2026
# un atacante reescribió 76 de 77 etiquetas de aquasecurity/trivy-action: quien usaba @etiqueta
# ejecutó malware; quien usaba el SHA, no. El comentario indica la versión de cada SHA.
jobs:
  pruebas:                      # Semanas 1-3 + Frentes 1 y 2: unitarias, API, integración sobre PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notasqa
          POSTGRES_USER: notasqa
          POSTGRES_PASSWORD: notasqa-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notasqa" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://notasqa:notasqa-ci@localhost:5432/notasqa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Pytest sobre PostgreSQL con Quality Gate de cobertura (pytest.ini)
        run: python -m pytest --cov-report=html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  sonarcloud:                   # Semana 7: análisis estático + Quality Gate
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65  # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  seguridad:                    # Frente 2: dependencias vulnerables + escaneo de la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: pip-audit (CVE en dependencias de producción)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Construir imagen
        run: docker build -t notasqa:${{ github.sha }} .
      - name: Trivy (vulnerabilidades HIGH/CRITICAL con parche disponible)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: notasqa:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.70.0

  e2e:                          # Frente 4: interfaz con Playwright (punta de la pirámide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas E2E
        run: python -m pytest -m e2e --no-cov tests/e2e --tracing retain-on-failure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: trazas-playwright
          path: test-results/

  contenedores:                 # Semanas 4-5 y 10 + Frente 3: compose completo
    needs: pruebas
    runs-on: ubuntu-latest
    env:
      DOCENTE_CLAVE: docente-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Pruebas de API dentro de contenedores
        run: docker compose up --build --exit-code-from test-runner
      - name: Flujo asíncrono E2E (API -> S3 + SQS -> worker)
        run: |
          docker compose up -d --wait api notificador
          python3 scripts/smoke_boletin.py http://localhost:8000
          for _ in $(seq 1 15); do
            docker compose logs notificador | grep -q "Boletín listo" && exit 0
            sleep 2
          done
          echo "El worker no procesó el evento"; docker compose logs notificador; exit 1
      - if: always()
        run: docker compose down -v

  carga:                        # Semana 8 + Frente 4: Locust por roles con umbrales
    needs: contenedores
    runs-on: ubuntu-latest
    env:
      DOCENTE_CLAVE: docente-local
      ESTUDIANTE_CLAVE: estudiante-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker compose up -d --build --wait api
      - name: Locust 100 usuarios / 60 s (falla si p95 > 500 ms o fallos > 1 %)
        run: python -m locust -f load/locustfile.py --headless -u 100 -r 10 -t 60s --host http://localhost:8000 --csv carga --only-summary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: reporte-carga
          path: carga_*.csv
      - if: always()
        run: docker compose down -v
