# Pruebas de mutación (Frente 1). mutmut altera reglas.py (cambia < por <=, 3.0 por 4.0, + por -...)
# y corre las pruebas: si ninguna falla, el mutante "sobrevive" = falta una prueba.
# Uso:  pip install "mutmut<3"  ->  mutmut run  ->  mutmut results  ->  mutmut show <id>
[mutmut]
paths_to_mutate = src/notas/reglas.py
runner = python -m pytest -x -q --no-cov -p no:cacheprovider tests/unit/test_reglas.py tests/unit/test_reglas_ampliadas.py
tests_dir = tests/unit/
